<!DOCTYPE html>
<html>
<!-- File heading ---------------------------------------------------------------->
<head>
    <title>Network Monitor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<!-- Body -------------------------------------------------------------------------->
<body>

<header>
    <h1>Network Monitor</h1>
</header>

<main>

    <div id="packets"></div>
    <div id="devices-count"></div>
    <div id="protocol"></div>

    <section id="stats">
        <!-- Cards -->
    </section>

    <section id="protocol-chart">
        <!-- Pie Chart -->
    </section>

    <section id="traffic-chart">
        <!-- Line Chart -->
    </section>

    <section id="devices">
        <!-- Table -->
    </section>

    <section id="alerts">
        <!-- Alert Feed -->
    </section>

    <table id="device-table">
    <thead>
        <tr>
            <th>IP</th>
            <th>Hostname</th>
            <th>Last Seen</th>
        </tr>
    </thead>

    <tbody></tbody>
</table>

</main>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

</body>
</html>
